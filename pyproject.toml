[project]
name = "ai-powered-legal-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "grace-sampao" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.165.0",
    "llama-index-embeddings-huggingface>=0.9.0",
    "llama-index-llms-deepseek>=0.5.0",
    "llama-index-vector-stores-chroma>=0.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-powered-legal-assistant = "ai_powered_legal_assistant:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
